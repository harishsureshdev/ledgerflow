name: LedgerFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package.json'

      - name: Run Backend Integration Tests (Testcontainers PostgreSQL + Kafka)
        run: |
          mvn clean test -Dsurefire.failIfNoSpecifiedTests=false

      - name: Install & Build React Dashboard
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Build Backend JAR Artifacts
        run: |
          mvn package -DskipTests
