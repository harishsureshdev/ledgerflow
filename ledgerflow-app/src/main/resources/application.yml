server:
  port: 8080

spring:
  application:
    name: ledgerflow-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  batch:
    job:
      enabled: false          # never run jobs at startup; the scheduler/endpoint launches them
    jdbc:
      initialize-schema: never  # Spring Batch tables come from Flyway (V6)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    model:
      # ollama (local, default) | bedrock-converse (prod) | none
      chat: ${AI_CHAT_PROVIDER:ollama}
    chat:
      client:
        # The investigator builds its own ChatClient; the auto-configured builder
        # would fail startup when no model is configured (AI_CHAT_PROVIDER=none).
        enabled: false
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.1}
          temperature: 0.0
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          options:
            # Set to a Bedrock model id / inference profile your AWS account has access to.
            model: ${BEDROCK_MODEL_ID:}
            temperature: 0.0
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledgerflow-payment-auditor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

ledgerflow:
  processor:
    base-url: ${PROCESSOR_BASE_URL:http://localhost:8081}
  recon:
    # inbox-dir: directory the bank drops settlement CSVs into. The nightly job is off unless it
    # is set (env LEDGERFLOW_RECON_INBOX_DIR). Left out here on purpose: an empty value would still
    # count as "set" for @ConditionalOnProperty.
    cron: ${RECON_CRON:0 30 2 * * *}
  investigator:
    ai:
      # When false, or when the model is unreachable, the deterministic rule-based investigator is used.
      enabled: ${INVESTIGATOR_AI_ENABLED:true}

resilience4j:
  circuitbreaker:
    instances:
      simProcessor:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      simProcessor:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
