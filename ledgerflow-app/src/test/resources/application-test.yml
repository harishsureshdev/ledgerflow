spring:
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: none   # no real model in tests; AI tests supply a scripted ChatModel bean
    chat:
      client:
        enabled: false

ledgerflow:
  scheduling:
    enabled: false   # tests drive the outbox relay / recon job explicitly
  ratelimit:
    payments:        # effectively unlimited so load/concurrency tests aren't throttled;
      capacity: 100000          # PaymentRateLimitIntegrationTest sets tight limits
      refill-per-minute: 100000
  investigator:
    ai:
      enabled: false

logging:
  level:
    com.ledgerflow: DEBUG
    org.flywaydb: INFO
