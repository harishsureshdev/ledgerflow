version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerflow-postgres
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ledgerflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ledgerflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-processor:
    build:
      context: .
      dockerfile: sim-processor/Dockerfile
    container_name: ledgerflow-sim-processor
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081

  ledgerflow-app:
    build:
      context: .
      dockerfile: ledgerflow-app/Dockerfile
    container_name: ledgerflow-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerflow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PROCESSOR_BASE_URL: http://sim-processor:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # LOCAL DEMO ONLY: lets the dashboard's persona switcher mint tokens for any role.
      LEDGERFLOW_DEMO_AUTH_ENABLED: "true"
      # Room for the dashboard's "fire 50 concurrent retries" idempotency demo
      RATELIMIT_PAYMENTS_CAPACITY: "100"
      RATELIMIT_PAYMENTS_REFILL: "100"
      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces   # only receives traces with --profile observability
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sim-processor:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ledgerflow-web
    ports:
      - "3000:80"
    depends_on:
      - ledgerflow-app

  # ---- Observability (optional): docker compose --profile observability up ----
  # Grafana http://localhost:3001 (admin/admin) · Jaeger http://localhost:16686 · Prometheus http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ledgerflow-prometheus
    profiles: ["observability"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: ledgerflow-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP over HTTP (the app sends traces here)

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ledgerflow-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ledgerflow.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"     # 3000 is the LedgerFlow web dashboard
    depends_on:
      - prometheus
      - jaeger

volumes:
  postgres_data:
